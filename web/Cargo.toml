[package]
name = "biohack2-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
name = "biohack2_web"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0"
chrono = { workspace = true, features = ["serde"] }
uuid = { workspace = true, features = ["v4", "serde", "js"] }

engine = { path = "../engine", default-features = false }

leptos = { version = "0.7", features = ["csr"] }
# Note: leptos_router removed — routing is hand-rolled in lib.rs (hash-based),
# and the unused crate pulled router machinery into the WASM bundle.

wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console", "Window", "Document", "Navigator", "HtmlElement", "Location", "EventTarget", "Event", "Blob", "ServiceWorkerContainer", "ServiceWorker", "Url", "FileReader", "File", "HtmlInputElement", "FileList", "FileSystemFileHandle"] }

gloo-storage = "0.3"
gloo-utils = "0.2"
gloo-net = "0.6"
getrandom = { version = "0.3", features = ["wasm_js"] }

[features]
default = []
ssr = ["leptos/ssr"]

# wasm-pack's auto-invoked wasm-opt fails on Windows with the npm wrapper;
# build-web.sh runs wasm-opt explicitly instead.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dev-dependencies]
wasm-bindgen-test = "0.3"
