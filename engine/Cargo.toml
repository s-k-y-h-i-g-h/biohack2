[package]
name = "engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true

[lib]
name = "engine"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
thiserror.workspace = true
anyhow.workspace = true
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# SQLite (only for native builds, not WASM)
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite", "chrono", "uuid", "json", "macros", "migrate"], optional = true }

[features]
default = ["db"]
db = ["sqlx"]

[dev-dependencies]
tempfile = "3.8"
assert_matches = "1.5"
