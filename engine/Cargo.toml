[package]
name = "engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true

[lib]
name = "engine"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
thiserror.workspace = true
anyhow.workspace = true
# SQLite (only for native builds, not WASM)
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite", "chrono", "uuid", "json", "macros", "migrate"], optional = true }
# Note: tracing/log were removed — engine never uses them; they added ~900KB
# of regex/env-filter machinery to the WASM bundle.

[features]
default = ["db"]
db = ["sqlx"]

[dev-dependencies]
tempfile = "3.8"
assert_matches = "1.5"
