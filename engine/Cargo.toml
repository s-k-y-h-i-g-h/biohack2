[package]
name = "engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true

[lib]
name = "engine"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
thiserror.workspace = true
# Generic CSV/JSON parsers (T313) — opt-in so the WASM bundle never pays
# for parsing machinery only the native file-ingest path uses.
csv = { workspace = true, optional = true }
anyhow.workspace = true
# SQLite (only for native builds, not WASM)
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite", "chrono", "uuid", "json", "macros", "migrate"], optional = true }
# Note: tracing/log were removed — engine never uses them; they added ~900KB
# of regex/env-filter machinery to the WASM bundle.

[features]
default = ["db"]
db = ["sqlx"]
file-ingest = ["dep:csv"]

# uuid v4 on wasm32 needs getrandom's JS backend; the web crate only got it
# through feature unification, so anything building `engine` alone for
# wasm32 (e.g. the T223 vectors example) requires it here.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true }
uuid = { workspace = true, features = ["js"] }

[dev-dependencies]
tempfile = "3.8"
assert_matches = "1.5"
