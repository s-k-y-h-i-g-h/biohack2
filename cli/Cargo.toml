[package]
name = "biohack2-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "biohack2 command line: file ingest for wearable exports (spec-004)"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
chrono = { workspace = true }
engine = { path = "../engine", features = ["file-ingest"] }
tokio = { version = "1.40", features = ["macros", "rt-multi-thread"] }

[[bin]]
name = "biohack2"
path = "src/main.rs"
