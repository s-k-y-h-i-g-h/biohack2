[package]
name = "biohack2-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true

[dependencies]
# file-ingest: the LAN host is where file-based ingest runs (T315/T316);
# enabling here also keeps the parser's tests compiled in workspace CI.
engine = { path = "../engine", features = ["file-ingest"] }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
serde = { workspace = true }
serde_json = "1.0"
uuid = { workspace = true }
chrono = { workspace = true }
anyhow = "1.0"
sqlx = { workspace = true }
futures = "0.3"

[lib]
path = "src/lib.rs"

[[bin]]
name = "biohack2-server"
path = "src/main.rs"
